# PORTAINER version: running the ready-made image from GitHub.
# Paste this into Portainer (Stacks, Add stack, Web editor) and enter your
# settings under "Environment variables" (or "Load variables from .env file"
# with your .env). Portainer saves them to stack.env; the env_file line below
# passes them into the container. Without it the container gets none of them.
#
# Settings:
#   (optional) PANEL_IMAGE=ghcr.io/hawaianblue21/pve-panel:1.2.0   to pin a release;
#              the default is ghcr.io/hawaianblue21/pve-panel:latest
# plus the usual panel settings (see example.env).

services:
  panel:
    image: ${PANEL_IMAGE:-ghcr.io/hawaianblue21/pve-panel:latest}
    pull_policy: always              # get the newest image of that tag on (re)deploy
    init: true
    restart: unless-stopped
    env_file: stack.env              # Portainer writes the stack's variables here
    environment:
      HOST: 0.0.0.0
      ADMIN_HOST: 0.0.0.0
      DB_PATH: /app/data/panel.db
    ports:
      - "3000:3000"                  # customer panel
      - "127.0.0.1:3001:3001"        # admin interface: only on the NAS itself
      # Alternative: admin in your LAN on the NAS's address (replace the line above,
      # never forward it on your router):
      # - "192.168.1.20:3001:3001"
    volumes:
      - panel-data:/app/data
      # - ./branding:/app/branding:ro   (own OS icons; BRANDING_DIR=/app/branding)
      # - ./pve-root-ca.pem:/app/certs/pve-root-ca.pem:ro   (PVE_CA_FILE=/app/certs/pve-root-ca.pem)

volumes:
  panel-data:
