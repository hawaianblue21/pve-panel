# Builds the Docker image and publishes it to the GitHub Container Registry:
#   ghcr.io/hawaianblue21/pve-panel  (https://github.com/hawaianblue21/pve-panel)
# Tags:
#   release tags (git tag v1.2.3): "1.2.3", "1.2", "1" and "latest"
#   pushes to main:                "edge" (development builds, e.g. 1.2.4-dev.abc1234)
#   every build:                   "sha-<commit>"
# So "latest" is always the newest RELEASE; development builds never replace it.
# Pull requests only build. Every build runs the tests first.

name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # The same tests as the Tests workflow; nothing is published unless they pass.
  # (Pull requests are already tested by the Tests workflow itself.)
  tests:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    needs: tests
    if: ${{ !cancelled() && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to ghcr.io with the built-in GITHUB_TOKEN
      id-token: write        # build provenance attestation
      attestations: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Registry names must be lowercase (GitHub user/repo names may not be)
      - name: Image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Release builds (tag v1.2.3) must match package.json; other builds are
      # "<package.json version>-dev.<commit>". The version is stamped into the image.
      - name: Version
        id: ver
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG. Release with 'npm version <patch|minor|major>' so both match."
              exit 1
            fi
            VERSION="$TAG"
          else
            VERSION="$PKG-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Set up QEMU (for the arm64 build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build (and push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.ver.outputs.date }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # After a tagged image is published: a GitHub Release with generated notes.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"; exit 0
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" \
            --notes "Docker image: \`$IMAGE\` (also \`latest\`). Update: redeploy the stack/project with a fresh pull."
