<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="box-sizing: border-box; width: 100%; padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #E6EBF2; background: #0D1424;">
<a href="{{homeHref}}" style="display: flex; align-items: center; gap: 10px; padding: 4px 8px; text-decoration: none; color: #E6EBF2;">
<svg width="28" height="28" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="7" fill="none" stroke="#4C9AFF" stroke-width="2"></rect><rect x="7" y="8" width="16" height="4" rx="1.5" fill="#4C9AFF"></rect><rect x="7" y="14" width="16" height="4" rx="1.5" fill="#4C9AFF" opacity="0.6"></rect><rect x="7" y="20" width="10" height="3" rx="1.5" fill="#4C9AFF" opacity="0.35"></rect></svg>
<span style="display: flex; flex-direction: column; line-height: 1.15;"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px;">PVE Panel</span><span style="font-size: 12px; color: #93A0B4;">{{portalLabel}}</span></span>
</a>
<nav aria-label="{{portalLabel}}" style="display: flex; flex-direction: column; gap: 18px;">
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 2px;">
<div style="padding: 0 10px 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: #7D8BA1;">{{sec.title}}</div>
<sc-for list="{{sec.items}}" as="it" hint-placeholder-count="3">
<sc-if value="{{it.active}}" hint-placeholder-val="{{false}}">
<a href="{{it.href}}" aria-current="page" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; padding: 0 10px; border-radius: 8px; background: #17284A; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600;"><span>{{it.label}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8EC2FF;">{{it.badge}}</span></a>
</sc-if>
<sc-if value="{{it.idle}}" hint-placeholder-val="{{true}}">
<a href="{{it.href}}" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; padding: 0 10px; border-radius: 8px; color: #B8C2D1; text-decoration: none; font-size: 14px;"><span>{{it.label}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #F5B94C;">{{it.badge}}</span></a>
</sc-if>
</sc-for>
</div>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 12px 10px; border-top: 1px solid #1F2A3F;">
<div style="display: flex; align-items: center; gap: 10px;">
<span style="width: 32px; height: 32px; border-radius: 50%; background: #1E2E4F; color: #8EC2FF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;" aria-hidden="true">{{initials}}</span>
<span style="display: flex; flex-direction: column; line-height: 1.25; min-width: 0;"><span style="font-size: 14px; font-weight: 500;">{{userName}}</span><span style="font-size: 12px; color: #93A0B4;">{{userSub}}</span></span>
</div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7D8BA1;">Panel [VERSION]</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"portal":{"editor":"enum","options":["admin","customer"],"default":"admin"},"active":{"editor":"text","default":"dashboard"},"$preview":{"width":260,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const portal = this.props.portal ?? 'admin';
    const active = this.props.active ?? (portal === 'admin' ? 'dashboard' : 'servers');
    const admin = [
      { title: 'INFRASTRUCTURE', items: [
        { key: 'dashboard', label: 'Overview', href: 'Main.dc.html', badge: '' },
        { key: 'nodes', label: 'Hosts & nodes', href: 'Admin-Hosts.dc.html', badge: 'owner' },
        { key: 'guests', label: 'Guests', href: 'Admin-Guests.dc.html', badge: '148' },
        { key: 'jobs', label: 'Provisioning jobs', href: 'Admin-Jobs.dc.html', badge: '4' },
        { key: 'templates', label: 'OS templates', href: 'Admin-Templates.dc.html', badge: 'owner' },
        { key: 'patching', label: 'Patch management', href: 'Admin-Updates.dc.html', badge: '41' },
        { key: 'ipam', label: 'Networking & IPAM', href: 'Admin-IPAM.dc.html', badge: '' }
      ]},
      { title: 'RESOURCES', items: [
        { key: 'pools', label: 'Resource pools', href: 'Admin-Pools.dc.html', badge: '' },
        { key: 'gpu', label: 'GPU compute', href: 'Admin-GPU.dc.html', badge: '' },
        { key: 'storage', label: 'Object storage', href: 'Admin-Storage.dc.html', badge: '' }
      ]},
      { title: 'CUSTOMERS & BILLING', items: [
        { key: 'customers', label: 'Customers', href: 'Admin-Customers.dc.html', badge: '' },
        { key: 'lifecycle', label: 'Server lifecycle', href: 'Admin-Lifecycle.dc.html', badge: '5' },
        { key: 'plans', label: 'Plans', href: 'Admin-Plans.dc.html', badge: '' },
        { key: 'billing', label: 'Billing', href: 'Admin-Billing.dc.html', badge: '' },
        { key: 'invoices', label: 'Invoices', href: 'Admin-Invoice.dc.html', badge: '6 due' }
      ]},
      { title: 'SUPPORT', items: [
        { key: 'desk', label: 'Ticket desk', href: 'Admin-Support.dc.html', badge: '12' },
        { key: 'ai', label: 'AI assistant', href: 'Admin-AI.dc.html', badge: '' },
        { key: 'kb', label: 'Knowledge base', href: 'Admin-KB.dc.html', badge: '' }
      ]},
      { title: 'SYSTEM', items: [
        { key: 'access', label: 'Access & roles', href: 'Admin-Access.dc.html', badge: 'owner' },
        { key: 'activity', label: 'Activity log', href: 'Admin-Activity.dc.html', badge: '' },
        { key: 'api', label: 'API & integrations', href: 'Admin-Integrations.dc.html', badge: 'owner' },
        { key: 'settings', label: 'Settings', href: 'Admin-Settings.dc.html', badge: 'owner' }
      ]}
    ];
    const customer = [
      { title: 'COMPUTE', items: [
        { key: 'servers', label: 'My servers', href: 'Customer-Servers.dc.html', badge: '3' },
        { key: 'create', label: 'Create server', href: 'Customer-Create.dc.html', badge: '' },
        { key: 'updates', label: 'Updates', href: 'Customer-Updates.dc.html', badge: 'new' },
        { key: 'renewals', label: 'Renewals', href: 'Customer-Expiry.dc.html', badge: '1 expiring' }
      ]},
      { title: 'STORAGE', items: [
        { key: 'block', label: 'Block storage', href: 'Customer-Block.dc.html', badge: 'new' },
        { key: 'object', label: 'Object storage', href: 'Customer-Object.dc.html', badge: 'new' }
      ]},
      { title: 'NETWORK', items: [
        { key: 'network', label: 'Network & VPN', href: 'Customer-Network.dc.html', badge: '' }
      ]},
      { title: 'BILLING', items: [
        { key: 'billing', label: 'Billing & wallet', href: 'Customer-Billing.dc.html', badge: '' },
        { key: 'invoices', label: 'Invoices', href: 'Customer-Invoice.dc.html', badge: '1 due' }
      ]},
      { title: 'ACCOUNT', items: [
        { key: 'security', label: 'Security & 2FA', href: 'Customer-Security.dc.html', badge: '' },
        { key: 'prefs', label: 'Appearance & sign-in', href: 'Customer-Preferences.dc.html', badge: 'new' }
      ]},
      { title: 'SUPPORT', items: [
        { key: 'tickets', label: 'Tickets', href: 'Customer-Tickets.dc.html', badge: '1 open' },
        { key: 'assistant', label: 'AI assistant', href: 'Customer-Assistant.dc.html', badge: 'new' },
        { key: 'kb', label: 'Knowledge base', href: 'Customer-KB.dc.html', badge: 'new' }
      ]}
    ];
    const src = portal === 'admin' ? admin : customer;
    const sections = src.map((s) => ({
      title: s.title,
      items: s.items.map((i) => ({ ...i, active: i.key === active, idle: i.key !== active }))
    }));
    return {
      sections,
      portalLabel: portal === 'admin' ? 'Admin portal' : 'Customer portal',
      homeHref: portal === 'admin' ? 'Main.dc.html' : 'Customer-Servers.dc.html',
      initials: portal === 'admin' ? 'OP' : 'RW',
      userName: portal === 'admin' ? 'Operations' : 'Rina Wijaya',
      userSub: portal === 'admin' ? 'admin · 2FA on' : 'PT Arunika Digital'
    };
  }
}
</script>
</body>
</html>
